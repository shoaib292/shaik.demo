
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>My To-Do List</h1>
                <p>Organize your day, achieve your goals.</p>
            </div>

            <button id="themeButton" class="theme-btn">
                🌙
            </button>
        </header>

        <!-- Task Statistics -->
        <div class="task-stats">

            <div class="stat-box">
                <h3 id="totalTasks">0</h3>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h3 id="completedTasks">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-box">
                <h3 id="pendingTasks">0</h3>
                <p>Pending</p>
            </div>

        </div>

        <!-- Add Task -->
        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addButton">+ Add</button>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>

        <footer>
            <p>Made with ❤️ by Shaik Shoaib</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
